<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B27">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sit with Him</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#EDF1EC;--ink:#1E2B27;--mute:#5A6B64;--card:#F8FAF6;--line:#C9D5CC;--accent:#B8862F;--btn:#1E2B27;--btntxt:#F2F5EF;--hl:rgba(184,134,47,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1815;--ink:#E4EBE4;--mute:#93A59B;--card:#17231F;--line:#2A3B35;--accent:#D4A24C;--btn:#E4EBE4;--btntxt:#0F1815;--hl:rgba(212,162,76,.3)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55;font-size:17px;-webkit-tap-highlight-color:transparent}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1.25rem calc(6rem + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--mute);font:inherit;font-size:.95rem;min-height:56px;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
h1,h2{font-family:Newsreader,Georgia,serif;font-weight:400;line-height:1.2;margin:0 0 .75rem}
h1{font-size:2rem}h2{font-size:1.4rem}
p{margin:0 0 1rem}.mute{color:var(--mute)}
.verse{font-family:Newsreader,Georgia,serif;font-size:1.25rem;line-height:1.7;border-left:3px solid var(--accent);padding:.25rem 0 .25rem 1rem;margin:.75rem 0 1.25rem}
.read{font-family:Newsreader,Georgia,serif;line-height:1.8}
sup{font-family:Figtree,sans-serif;font-size:.6em;color:var(--mute)}
.hl{background:var(--hl);border-radius:4px}
.ref{font-weight:600;color:var(--mute);font-size:.95rem;margin:0}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.g5{grid-template-columns:repeat(5,1fr)}
button.m,button.t{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.9rem .5rem;min-height:52px;font:inherit;cursor:pointer}
button.m:hover,button.t:hover,button.t.on{border-color:var(--accent)}
button.go{background:var(--btn);color:var(--btntxt);border:0;border-radius:10px;padding:.85rem 1.4rem;min-height:52px;font:inherit;font-weight:600;cursor:pointer;margin-top:.5rem}
button.link{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;margin-left:1rem;min-height:44px}
button.back{background:none;border:0;color:var(--mute);font:inherit;padding:.5rem 0;margin-bottom:.5rem;min-height:44px;cursor:pointer}
button.res{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.8rem;margin:0 0 .6rem;font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clock{font-family:Newsreader,Georgia,serif;font-size:4rem;text-align:center;margin:1.5rem 0}
.times{display:flex;gap:.6rem;margin:1rem 0}.times .t{flex:1}
.sr{display:flex;gap:.5rem;margin-bottom:1rem}.sr button.go{margin:0}
input,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.8rem;font:inherit}
textarea{min-height:9rem;resize:vertical}
.entry{border-top:1px solid var(--line);padding:1rem 0}
.entry p{white-space:pre-wrap;margin:.4rem 0 0}
.grp h3{font-size:.8rem;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:1.5rem 0 0}
#fe{margin:.5rem 0 0}
.vs{cursor:pointer;border-radius:4px}
.h0{background:rgba(250,204,21,.38)}.h1{background:rgba(74,222,128,.32)}.h2{background:rgba(96,165,250,.34)}.h3{background:rgba(244,114,182,.32)}
.sel{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;padding:.6rem .75rem;background:var(--card);border-top:1px solid var(--line)}
.bar button{min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;padding:0 .8rem}
.bar button.dot{border-radius:50%;padding:0;border:2px solid var(--line)}
.note{background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:.8rem 1rem;margin:0 0 1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:20px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;min-height:44px;font:inherit}
</style>

<main id="app"></main>
<div id="toast" class="toast"></div>
<nav id="nav"><button data-a="tab" data-v="today" class="on">Today</button><button data-a="tab" data-v="bible">Bible</button><button data-a="tab" data-v="tempt">Tempted?</button><button data-a="tab" data-v="prayers">Prayers</button><button data-a="tab" data-v="journal">Journal</button></nav>
